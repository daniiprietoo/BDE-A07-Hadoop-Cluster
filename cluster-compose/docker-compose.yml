services:
  namenode:
    image: namenode-image
    container_name: namenode
    networks:
      hadoop-cluster:
        aliases:
          - resourcemanager
    hostname: namenode
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "8000-10000"
    ports:
      - "9870:9870"
      - "8088:8088"
    volumes:
      - namenode:/var/data/hdfs/namenode
      - configNamenode:/opt/bd/hadoop/etc/hadoop/
    command: /start.sh

  datanode1:
    image: datanode-image
    container_name: datanode1
    networks:
      - hadoop-cluster
    hostname: datanode1
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "8000-10000"
      - "50000-50200"
    volumes:
      - datanode1:/var/data/hdfs/datanode
    command: /start.sh

  datanode2:
    image: datanode-image
    container_name: datanode2
    networks:
      - hadoop-cluster
    hostname: datanode2
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "8000-10000"
      - "50000-50200"
    volumes:
      - datanode2:/var/data/hdfs/datanode
    command: /start.sh

  datanode3:
    image: datanode-image
    container_name: datanode3
    networks:
      - hadoop-cluster
    hostname: datanode3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "8000-10000"
      - "50000-50200"
    volumes:
      - datanode3:/var/data/hdfs/datanode
    command: /start.sh

  backupnode:
    image: backupnode-image
    container_name: backupnode
    networks:
      - hadoop-cluster
    hostname: backupnode
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "50100"
    ports:
      - "50105:50105"
    volumes:
      - backupnode:/var/data/hdfs/backupnode
    command:
      bash -lc 'su alejandro_daniel -c
      "sleep 30 &&
      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64 &&
      export HADOOP_HOME=/opt/bd/hadoop &&
      /opt/bd/hadoop/bin/hdfs namenode -backup"'

  datanode5:
    image: datanode-image
    container_name: datanode5
    networks:
      - hadoop-cluster
    hostname: datanode5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "8000-10000"
      - "50000-50200"
    volumes:
      - datanode5:/var/data/hdfs/datanode
    command: /start.sh

  datanode6:
    image: datanode-image
    container_name: datanode6
    networks:
      - hadoop-cluster
    hostname: datanode6
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "8000-10000"
      - "50000-50200"
    volumes:
      - datanode6:/var/data/hdfs/datanode
    command: /start.sh

  timelineserver:
    platform: linux/amd64
    image: hadoop-base-amd64
    container_name: timelineserver
    networks:
      - hadoop-cluster
    hostname: timelineserver
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 3072m
    expose:
      - "10200"
    ports:
      - "8188:8188"
    volumes:
      - configNamenode:/opt/bd/hadoop/etc/hadoop/
    command: >-
      bash -lc 'su alejandro_daniel -c
      "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 &&
      export HADOOP_HOME=/opt/bd/hadoop &&
      /opt/bd/hadoop/bin/yarn --daemon start timelineserver" &&
      while true; do sleep 10000; done'


    
# Add three more DataNodes here
networks:
  hadoop-cluster:

volumes:
  namenode:
  configNamenode:
  datanode1:
  datanode2:
  datanode3:
  backupnode:
  timelineserver:
  datanode5:
  datanode6:
# Add three more DataNodes here
